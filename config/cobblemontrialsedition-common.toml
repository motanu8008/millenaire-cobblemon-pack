#Whether to log data regarding the location and data stored when placing cobblemon trial spawners.
enableDebugLogs = false
#Whether to enable or disable the custom recipe for Trial Potions.
enableTrialPotionRecipe = true
#A List of structures that will be skipped. Prefix with '#' to denote a structure tag (e.g., '#minecraft:village').
blacklistedStructureIds = []
#Whether to do any spawner replacement at all. If set to false, this will disable all spawner replacement.
replaceGeneratedSpawnersWithCobblemonSpawners = true
#Whether to do any spawner replacement in structures. If set to false, this will disable all spawner replacement in structures.
replaceSpawnersInStructuresWithCobblemonSpawners = true
#Whether to replace any Block specific requests like Shriekers with Cobblemon Trial Spawners.
replaceAnyBlocksWithCobblemonSpawners = true
#Whether to replace any spawners that are not listed in configuration with a default spawner. If set to false, this will leave spawners that do not have custom spawn data created.
replaceAnyUnspecifiedSpawnersWithDefaultCobblemonSpawners = true
#This allows Spawned Pokemon to be Catchable. If set to True, regardless of spawner settings, Pokemon will always be catchable.If set to false whether Spawned Pokemon can be catchable or not is left up to the Spawner's Settings.NOTE: This will only apply to newly created spawners.
spawnedPokemonAreUncatchable = true
#This allows Spawned Pokemon to be defeated outside of battle. If set to true, regardless of spawner settings, Pokemon will be required to be defeated in battle.If set to false whether Spawned Pokemon can be defeated in battle or not is left up to the Spawner's Settings.NOTE: This will only apply to newly created spawners.
spawnedPokemonMustBeDefeatedInBattle = true
#This allows Spawned Pokemon to be Aggressive and attack players when spawned." +
#"Whether Spawned Pokemon can be aggressive or not if Fight or Flight is installed. Both this setting and 'Attack Players Unprovoked' in Fight or Flight must be set to true." +
#"NOTE: This will only apply to newly created spawners.
allowSpawnedPokemonToBeAggressive = true
#This is what percentage (0.0 - 1.0) Mob Spawners will be replaced, eg: .75 will mean 75% of each trial spawner within a structure will be replaced." +
#"NOTE: This will only apply in newly generated chunks.
# Default: 1.0
# Range: 0.0 ~ 1.0
mobSpawnerReplacementPercentage = 1.0
#This is what percentage (0.0 - 1.0) Trial Spawners will be replaced, eg: .75 will mean 75% of each trial spawner within a structure will be replaced." +
#"NOTE: This will only apply in newly generated chunks.
# Default: 1.0
# Range: 0.0 ~ 1.0
trialSpawnerReplacementPercentage = 1.0
#This is what percentage (0.0 - 1.0) Blocks will be replaced, eg: .75 will mean 75% of each Blocks within a structure will be replaced." +
#"NOTE: This will only apply in newly generated chunks.
# Default: 1.0
# Range: 0.0 ~ 1.0
blockReplacementPercentage = 1.0
#This is what percentage (0.0 - 1.0) Pokemon spawned will be Alpha Pokemon. eg: .75 will mean there is a 75% chance a pokemon spawned will be an alpha.
# Default: 0.1
# Range: 0.0 ~ 1.0
alphaPokemonPercentage = 0.1
#This is if the Pokemon spawned from Cobblemon Trial Spawners will adjust their level based on the players parties around them.
enablePokemonLevelAdjustment = true
#This will determine the type of level adjustment the pokemon will have. Valid values are AVERAGE or MEDIAN. These values are calculated from " +
#"all pokemon in each players party within range of the spawner. Default is AVERAGE, unknown values will default to AVERAGE.
pokemonLevelAdjustmentType = "AVERAGE"
#This will determine how long pokemon spawned from Trial Spawners will remain until they despawn. " +
#"The time only matters when the cobblemon are loaded.
timeTillPokemonDespawnInTicks = 6000
